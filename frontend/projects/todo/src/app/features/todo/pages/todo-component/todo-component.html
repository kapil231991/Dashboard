<div class="card p-3">
  <p-toast></p-toast>
  <p-confirmDialog></p-confirmDialog>

  <div class="d-flex justify-content-between align-items-center mb-3">
    <h5 class="m-0">My Todos</h5>
    <a routerLink="add" class="btn btn-primary">
      <i class="pi pi-plus me-2"></i> New Todo
    </a>
  </div>

  <p-table [value]="todosList" [rows]="10" [paginator]="true" responsiveLayout="scroll">
    <ng-template pTemplate="header">
      <tr>
        <th>Title</th>
        <th>Status</th>
        <th>Due Date</th>
        <th>Created</th>
        <th>Actions</th>
      </tr>
    </ng-template>
    <ng-template pTemplate="body" let-todo>
      <tr>
        <td>
          <div class="fw-bold">{{ todo.title }}</div>
          <div class="text-muted small">{{ todo.description }}</div>
        </td>
        <td>
          <p-tag [value]="todo.status" [severity]="todo.status === 'DONE' ? 'success' : 'warn'"></p-tag>
        </td>
        <td>{{ todo.dueDate | date:'mediumDate' }}</td>
        <td>{{ todo.createdDate | date:'short' }}</td>
        <td>
          <button pButton icon="pi pi-check" class="p-button-text p-button-success p-button-sm"
            (click)="markDone(todo.id, todo.status)" [disabled]="todo.status === 'DONE'"></button>
          <button pButton icon="pi pi-pencil" class="p-button-text p-button-sm"
            [routerLink]="['edit', todo.id]"></button>
          <button pButton icon="pi pi-trash" class="p-button-text p-button-danger p-button-sm"
            (click)="delete(todo.id)"></button>
        </td>
      </tr>
    </ng-template>
    <ng-template pTemplate="emptymessage">
      <tr>
        <td colspan="5" class="text-center">No todos found.</td>
      </tr>
    </ng-template>
  </p-table>
</div>
