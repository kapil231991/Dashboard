<div class="card p-3">
    <p-toast></p-toast>
    <p-confirmDialog></p-confirmDialog>

    <div class="d-flex justify-content-between align-items-center mb-3">
        <h5 class="m-0">My Notes</h5>
        <a routerLink="add" class="btn btn-primary">
            <i class="pi pi-plus me-2"></i> New Note
        </a>
    </div>

    <div class="mb-3 position-relative">
        <i class="pi pi-search position-absolute" style="left:10px;top:50%;transform:translateY(-50%)"></i>
        <input type="text" class="form-control ps-5" placeholder="Search notes..." (input)="onSearch($event)" />
    </div>


    <p-table #dt [value]="notes()" [rows]="10" [paginator]="true" responsiveLayout="scroll"
        [globalFilterFields]="['title','content']">
        <ng-template pTemplate="header">
            <tr>
                <th>Title</th>
                <th class="text-center action-col" style="width: 150px">Actions</th>
            </tr>
        </ng-template>
        <ng-template pTemplate="body" let-note>
            <tr>
                <td>{{ note.title }}</td>
                <td class="text-center action-col">
                    <button pButton icon="pi pi-eye" class="p-button-text p-button-sm me-1"
                        (click)="viewNote(note)"></button>
                    <button pButton icon="pi pi-pencil" class="p-button-text p-button-sm me-1"
                        [routerLink]="['edit', note.id]"></button>
                    <button pButton icon="pi pi-trash" class="p-button-text p-button-danger p-button-sm"
                        (click)="deleteNote(note.id)"></button>
                </td>
            </tr>
        </ng-template>
        <ng-template pTemplate="emptymessage">
            <tr>
                <td colspan="2" class="text-center">No notes found.</td>
            </tr>
        </ng-template>
    </p-table>
</div>
