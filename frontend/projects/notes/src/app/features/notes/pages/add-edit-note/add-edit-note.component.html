<div class="card p-3">
    <h5 class="mb-3">{{ title }}</h5>

    <form [formGroup]="form" (ngSubmit)="submit()" class="d-flex flex-column gap-3">

        <div class="d-flex flex-column gap-2">
            <label class="fw-bold">Title</label>
            <input pInputText class="w-100" formControlName="title" />
        </div>

        <div class="d-flex flex-column gap-2">
            <label class="fw-bold">Content</label>
            <p-editor formControlName="content" [style]="{ height: '320px' }"></p-editor>
        </div>

        <div class="d-flex gap-2 mt-2">
            <button pButton type="submit" [label]="submitLabel" [disabled]="form.invalid"></button>
            <button pButton type="button" label="Cancel" class="p-button-secondary" routerLink=".."></button>
        </div>
    </form>
</div>
