<div class="card p-3">
  <div class="d-flex justify-content-between align-items-center mb-3">
    <h5 class="m-0">Accounts</h5>
    <a routerLink="add" class="btn btn-primary">
      <i class="pi pi-plus me-2"></i> Add Account
    </a>
  </div>

  <p-table
    [value]="accounts"
    [loading]="loading"
    [paginator]="true"
    [rows]="10"
  >
    <ng-template pTemplate="header">
      <tr>
        <th>Name</th>
        <th>Type</th>
        <th>Opening Balance</th>
        <th>Status</th>
        <th>Created</th>
      </tr>
    </ng-template>

    <ng-template pTemplate="body" let-a>
      <tr>
        <td>{{ a.name }}</td>
        <td>{{ a.accountType }}</td>
        <td>{{ a.openingBalance | number:'1.2-2' }}</td>
        <td>{{ a.status }}</td>
        <td>{{ a.createdDate | date:'short' }}</td>
      </tr>
    </ng-template>
  </p-table>
</div>
