<div class="card p-3">
    <div class="mb-3">
        <div class="d-flex justify-content-between align-items-center mb-2">
            <h5 class="m-0">Milestones for: {{ goalTitle }}</h5>
            <div>
                <a routerLink="add" class="btn btn-primary me-2">
                    <i class="pi pi-plus me-2"></i> Add Milestone
                </a>
                <a routerLink="/strategy/goals" class="btn btn-secondary">
                    <i class="pi pi-arrow-left me-2"></i> Back to Goals
                </a>
            </div>
        </div>
        <p class="text-muted mb-0" *ngIf="goalDescription">{{ goalDescription }}</p>
    </div>

    <p-table class="milestones-table" [value]="milestones" [loading]="loading" [paginator]="true" [rows]="10"
        [rowsPerPageOptions]="[5,10,20]" responsiveLayout="scroll">
        <ng-template pTemplate="header">
            <tr>
                <th>Year</th>
                <th>Month</th>
                <th>Title</th>
                <th>Description</th>
                <th>Status</th>
                <th>Actions</th>
            </tr>
        </ng-template>

        <ng-template pTemplate="body" let-milestone>
            <tr>
                <td>{{ milestone.year }}</td>
                <td>{{ milestone.month }}</td>
                <td>{{ milestone.title }}</td>
                <td>{{ milestone.description }}</td>
                <td>
                    <span class="px-2 py-1 border-round text-sm" [ngClass]="{
            'bg-green-100 text-green-700': milestone.status === 'ACTIVE',
            'bg-blue-100 text-blue-700': milestone.status === 'COMPLETED',
            'bg-red-100 text-red-700': milestone.status === 'CANCELLED'
          }">
                        {{ milestone.status }}
                    </span>
                </td>

                <!-- Actions -->
                <td class="text-center action-col">
                    <button pButton type="button" icon="pi pi-check-square" class="p-button-text p-button-sm me-2"
                        (click)="onViewTasks(milestone.id)" pTooltip="View Tasks" tooltipPosition="top"></button>

                    <button pButton type="button" icon="pi pi-pencil" class="p-button-text p-button-sm me-2"
                        (click)="onEdit(milestone.id)"></button>

                    <button pButton type="button" icon="pi pi-trash" class="p-button-text p-button-sm p-button-danger"
                        (click)="onDelete(milestone.id)"></button>
                </td>
            </tr>
        </ng-template>

        <ng-template pTemplate="emptymessage">
            <tr>
                <td colspan="6" class="text-center">No milestones found for this goal.</td>
            </tr>
        </ng-template>
    </p-table>

</div>
