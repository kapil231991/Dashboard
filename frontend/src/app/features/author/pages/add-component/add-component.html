<div class="card p-4" style="max-width: 500px; margin: auto;">
  <h4 class="mb-3">Add Author</h4>

  <form [formGroup]="form" (ngSubmit)="submit()">
    <div class="mb-3">
      <label class="form-label">Name</label>
      <input pInputText formControlName="name" class="w-100" />
      <small class="text-danger" *ngIf="form.controls.name.touched && form.controls.name.invalid">
        Name is required
      </small>
    </div>

    <div class="mb-3">
      <label class="form-label">Email</label>
      <input pInputText formControlName="email" class="w-100" />
      <small class="text-danger" *ngIf="form.controls.email.touched && form.controls.email.invalid">
        Valid email is required
      </small>
    </div>

    <div class="mb-3">
      <label class="form-label">Country</label>
      <input pInputText formControlName="country" class="w-100" />
      <small class="text-danger" *ngIf="form.controls.country.touched && form.controls.country.invalid">
        Country is required
      </small>
    </div>

    <div class="d-flex justify-content-end gap-2">
      <button type="button" class="btn btn-secondary" routerLink="/author">
        Cancel
      </button>

      <button pButton type="submit" label="Save" [disabled]="submitting"></button>
    </div>
  </form>
</div>
