    <button (click)="add()">Add Todo</button>
    <h3>Open Todos</h3>
    <ul>
      <li *ngFor="let t of todoService.openTodos(); let i = index">
        {{ t.title }}
    <button (click)="done(i)">Mark First Done</button>
      </li>
    </ul>

    <h3>Done Todos</h3>
    <ul>
      <li *ngFor="let t of todoService.doneTodos(); let i = index">
        {{ t.title }}
      </li>
    </ul>
