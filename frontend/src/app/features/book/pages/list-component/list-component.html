<div class="card p-3">
  <div class="d-flex justify-content-between align-items-center mb-3">
    <h5 class="m-0">Books</h5>
    <a routerLink="/book/add" class="btn btn-primary">Add Book</a>
  </div>

  <!-- 🔍 Search box -->
  <input type="text" class="form-control mb-3" placeholder="Search books..." (input)="onSearch($event.target.value)" />


  <p-table [value]="(books$ | async) ?? []" [loading]="loading$ | async">
    <ng-template pTemplate="header">
      <tr>
        <th>Title</th>
        <th>Author</th>
        <th>Genre</th>
        <th>Published Year</th>
        <th>Action</th>
      </tr>
    </ng-template>

    <ng-template pTemplate="body" let-b>
      <tr>
        <td>{{ b.title }}</td>
        <td>{{ b.authorName }}</td>
        <td>{{ b.genre }}</td>
        <td>{{ b.publishedYear }}</td>
        <td>
          <button class="btn btn-sm btn-danger" (click)="deleteBook(b.id!)">
            Delete
          </button>
        </td>
      </tr>
    </ng-template>
  </p-table>

</div>
