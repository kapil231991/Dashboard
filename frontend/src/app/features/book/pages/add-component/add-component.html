<div class="card p-4" style="max-width: 600px; margin: auto;">
  <h4 class="mb-3">Add Book</h4>

  <form [formGroup]="form" (ngSubmit)="submit()">
    <div class="mb-3">
      <label>Title</label>
      <input pInputText class="w-100" formControlName="title" />
    </div>

    <div class="mb-3">
      <label>ISBN</label>
      <input pInputText class="w-100" formControlName="isbn" />
    </div>

    <div class="mb-3">
      <label>Publisher</label>
      <input pInputText class="w-100" formControlName="publisher" />
    </div>

    <div class="mb-3">
      <label>Published Year</label>
      <input pInputText type="number" class="w-100" formControlName="publishedYear" />
    </div>

<div class="mb-3">
  <label>Author</label>
  <select class="form-select" formControlName="authorId">
    <option [ngValue]="null">Select Author</option>
    <option *ngFor="let a of (authors$ | async) ?? []" [value]="a.id">
      {{ a.name }}
    </option>
  </select>
</div>

    <div class="d-flex justify-content-end gap-2">
      <a routerLink="/book" class="btn btn-secondary">Cancel</a>
      <button pButton type="submit" label="Save"></button>
    </div>
  </form>
</div>
